name: junit test

on: 
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with: 
          java-version: '23'
          distribution: 'oracle'
          cache: gradle
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: ./java-numer0n
      - name: Test with Gradle
        run: ./gradlew test
        
